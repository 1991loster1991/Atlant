<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Degradado de fondo estilo mapa antiguo/moderno -->
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    <!-- Estilo para las líneas de agua y costa -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Fondo General -->
  <rect width="1000" height="1000" fill="url(#mapBg)" />
  <rect width="1000" height="1000" fill="url(#grid)" />

  <!-- Zona de Costa / Océano (Estilo Ilustración) -->
  <path d="M 0,0 C 300,100 400,300 350,600 C 300,900 500,1000 500,1000 L 0,1000 Z" fill="#0284c7" fill-opacity="0.15" />
  <path d="M 0,0 C 250,80 350,250 300,550 C 250,850 450,1000 450,1000 L 0,1000 Z" fill="#0284c7" fill-opacity="0.1" />

  <!-- Elemento Decorativo: Olas del Río / Mar -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-opacity="0.4" stroke-linecap="round">
    <path d="M 100,200 Q 120,190 140,200 T 180,200" />
    <path d="M 200,400 Q 220,390 240,400 T 280,400" />
    <path d="M 150,750 Q 170,740 190,750 T 230,750" />
  </g>

  <!-- Elemento Decorativo: Brújula / Rosa de los Vientos Minimalista -->
  <g transform="translate(850, 150)">
    <circle cx="0" cy="0" r="45" fill="#1e293b" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.8" />
    <polygon points="0,-35 6,-8 0,0 -6,-8" fill="#fbbf24" />
    <polygon points="0,35 6,8 0,0 -6,8" fill="#94a3b8" />
    <polygon points="35,0 8,6 0,0 8,-6" fill="#94a3b8" />
    <polygon points="-35,0 -8,6 0,0 -8,-6" fill="#94a3b8" />
    <text x="0" y="-42" fill="#fbbf24" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">N</text>
  </g>

  <!-- Título decorativo flotante en el mapa -->
  <text x="80" y="920" fill="#fbbf24" font-size="28" font-family="sans-serif" font-weight="bold" opacity="0.8">San Clemente del Tuyú</text>
  <text x="82" y="945" fill="#94a3b8" font-size="14" font-family="sans-serif" opacity="0.6">Guía Interactiva Oficial • Partido de La Costa</text>
</svg>
